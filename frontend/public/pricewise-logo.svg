<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <defs>
    <linearGradient id="pwGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Price Tag -->
  <path d="M130 90 h120 l50 50 v140 l-50 50 h-120 a30 30 0 0 1 -30 -30 v-180 a30 30 0 0 1 30 -30 z"
        fill="url(#pwGradient)"/>

  <circle cx="155" cy="140" r="14" fill="white"/>

  <text x="150" y="260"
        fill="white"
        font-size="72"
        font-family="Segoe UI, Arial, sans-serif"
        font-weight="700">
    $
  </text>

  <!-- Chip -->
  <rect x="250" y="70"
        width="260"
        height="260"
        rx="40"
        fill="white"
        stroke="#091F5B"
        stroke-width="12"/>

  <!-- Chip Pins Top -->
  <g stroke="#091F5B" stroke-width="8">
    <line x1="310" y1="70" x2="310" y2="35"/>
    <line x1="380" y1="70" x2="380" y2="35"/>
    <line x1="450" y1="70" x2="450" y2="35"/>

    <line x1="310" y1="330" x2="310" y2="365"/>
    <line x1="380" y1="330" x2="380" y2="365"/>
    <line x1="450" y1="330" x2="450" y2="365"/>

    <line x1="510" y1="130" x2="545" y2="130"/>
    <line x1="510" y1="200" x2="545" y2="200"/>
    <line x1="510" y1="270" x2="545" y2="270"/>
  </g>

  <!-- Bars -->
  <rect x="300" y="240" width="35" height="55" rx="6" fill="url(#pwGradient)"/>
  <rect x="355" y="200" width="35" height="95" rx="6" fill="url(#pwGradient)"/>
  <rect x="410" y="150" width="35" height="145" rx="6" fill="url(#pwGradient)"/>

  <!-- Trend Line -->
  <polyline
      points="285,260 340,200 390,225 465,145"
      fill="none"
      stroke="#091F5B"
      stroke-width="8"
      stroke-linejoin="round"
      stroke-linecap="round"/>

  <polygon points="455,140 475,140 465,120"
           fill="#091F5B"/>

  <!-- Wordmark -->
  <text x="100"
        y="455"
        font-size="88"
        font-family="Segoe UI, Arial, sans-serif"
        font-weight="700"
        fill="#091F5B">
    Price
  </text>

  <text x="320"
        y="455"
        font-size="88"
        font-family="Segoe UI, Arial, sans-serif"
        font-weight="700"
        fill="#22C55E">
    Wise
  </text>

  <!-- Tagline -->
  <text x="100"
        y="490"
        font-size="20"
        font-family="Segoe UI, Arial, sans-serif"
        letter-spacing="2"
        fill="#334155">
    SMARTER PRICING. SMARTER DECISIONS.
  </text>
</svg>