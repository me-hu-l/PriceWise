services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricewise
      POSTGRES_PASSWORD: pricewise
      POSTGRES_DB: pricewise
    ports:
      - "5432:5432"
    volumes:
      - pricewise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://pricewise:pricewise@postgres:5432/pricewise
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed_database &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pricewise_postgres_data:
